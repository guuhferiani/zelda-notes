<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="zGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1d5" />
      <stop offset="55%" stop-color="#e2d29b" />
      <stop offset="100%" stop-color="#b8963e" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro -->
  <rect width="64" height="64" rx="10" fill="#14110f" />
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#3a2e1d" stroke-width="1.5" />

  <!-- Z estilizado estilo Zelda -->
  <path
    d="M15 13 H49 L45 21 H42 L26 45 H43 L46 40 H50 L47 51 H13 L17 43 H20 L36 19 H19 L16 24 H12 Z"
    fill="url(#zGold)"
    stroke="#2b2113"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Detalhe interno na diagonal do Z -->
  <path
    d="M23 43 L39 19"
    stroke="#6b5324"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Mini Triforce no canto inferior direito -->
  <g transform="translate(43, 35) scale(0.75)" fill="#d4af37" opacity="0.9">
    <polygon points="8,0 12,7 4,7" />
    <polygon points="4,7 8,14 0,14" />
    <polygon points="12,7 16,14 8,14" />
  </g>
</svg>
